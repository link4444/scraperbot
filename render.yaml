services:
  # ── Backend (FastAPI + Playwright + APScheduler) ──────────────────────────
  - type: web
    name: price-monitor-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./pricemonitor.db
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (Vite / React static site) ──────────────────────────────────
  - type: web
    name: price-monitor-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
