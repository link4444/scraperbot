services:
  - type: web
    name: price-monitor-backend
    env: docker
    rootDir: backend
    plan: free
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/pricemonitor.db
      - key: DISCORD_WEBHOOK_URL
        sync: false
