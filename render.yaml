services:
  # ── Backend (FastAPI + Playwright + APScheduler) ──────────────────────────
  - type: web
    name: price-monitor-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./pricemonitor.db
      - key: GROQ_API_KEY
        sync: false              # REQUIRED for AI chat (online mode). Get one at console.groq.com
      - key: DISCORD_WEBHOOK_URL
        sync: false              # Optional: alerts via Discord
      - key: FRONTEND_URL
        sync: false              # REQUIRED: your frontend URL (e.g. https://price-monitor-frontend.onrender.com) for CORS
      - key: CORS_ORIGINS
        sync: false              # Optional: comma-separated list of extra CORS origins

  # ── Frontend (Vite / React static site) ──────────────────────────────────
  - type: web
    name: price-monitor-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false              # REQUIRED: backend URL (e.g. https://price-monitor-backend.onrender.com)
